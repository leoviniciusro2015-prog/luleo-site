<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas | LuLéo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
      <nav class="back-nav">
    <a href="index.html" class="back-home">← Voltar ao início</a>
</nav>

<header>
    <h1>FERRAMENTAS</h1>
    <p>Ferramentas que fazem parte da minha vida real.</p>
</header>

<main>

   <section>
    <h2>O que eu uso</h2>

    <input type="text" id="search-box" class="search-box" placeholder="Buscar produto...">

    <div class="product-grid">

           <a href="https://meli.la/1LfQHGu" target="_blank" class="product-card">
    <img src="./serra-tico-tico.webp" alt="Serra tico-tico" class="product-image">
    <strong>Serra tico-tico</strong>
    <span>Disponível no Mercado Livre</span>
</a>

        </div>

    </section>

</main>

<footer>
    <p>LU LÉO</p>
    <span>Produtos que fazem parte da minha vida real.</span>
</footer>
<script>
document.getElementById('search-box').addEventListener('input', function() {
    const termo = this.value.toLowerCase();
    const produtos = document.querySelectorAll('.product-card');

    produtos.forEach(function(produto) {
        const nome = produto.querySelector('strong').textContent.toLowerCase();
        produto.style.display = nome.includes(termo) ? 'flex' : 'none';
    });
});
</script>
</body>
</html>
